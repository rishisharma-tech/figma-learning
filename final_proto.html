<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts — Filter Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #f1f3f4;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      overflow: hidden;
      height: 100vh;
    }

    /* ─── Left rail nav ─── */
    .rail {
      width: 52px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      flex-shrink: 0;
      z-index: 10;
    }
    .rail-logo {
      width: 32px; height: 32px;
      background: #1a73e8; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
    }
    .rail-logo svg { width: 18px; height: 18px; fill: white; }
    .rail-icon {
      width: 36px; height: 36px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #5f6368;
    }
    .rail-icon:hover { background: #f1f3f4; }
    .rail-icon.active { background: #e8f0fe; color: #1a73e8; }
    .rail-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .rail-spacer { flex: 1; }

    /* ─── Secondary sidebar ─── */
    .sidebar {
      width: 200px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      padding: 16px 0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .sidebar-title { font-size: 16px; font-weight: 500; padding: 0 16px 12px; }
    .sidebar-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; font-size: 13px; color: #3c4043; cursor: pointer;
    }
    .sidebar-item:hover { background: #f1f3f4; }
    .sidebar-item.active { background: #e8f0fe; color: #1a73e8; font-weight: 500; border-radius: 0 20px 20px 0; }
    .sidebar-add {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; font-size: 13px; color: #3c4043; cursor: pointer; margin-bottom: 8px;
    }
    .sidebar-add:hover { background: #f1f3f4; }
    .add-circle {
      width: 22px; height: 22px; background: #1a73e8; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .add-circle svg { width: 12px; height: 12px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .sidebar-group {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; font-size: 13px; color: #3c4043; cursor: pointer;
    }
    .sidebar-group:hover { background: #f1f3f4; }
    .sidebar-group svg { width: 14px; height: 14px; stroke: #5f6368; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* ─── Main content area ─── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* Top bar */
    .topbar {
      height: 52px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar-btn {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; background: transparent;
    }
    .topbar-btn:hover { background: #f1f3f4; }
    .topbar-btn svg { width: 16px; height: 16px; stroke: #5f6368; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .topbar-plus {
      width: 32px; height: 32px; background: #1a73e8; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .topbar-plus svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .topbar-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: #ea8600;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 500; color: white; cursor: pointer;
    }
    .topbar-menu { cursor: pointer; color: #5f6368; display: flex; align-items: center; }
    .topbar-menu svg { width: 18px; height: 18px; stroke: #5f6368; fill: none; stroke-width: 2; stroke-linecap: round; }

    /* Content body */
    .content-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Contacts area */
    .contacts-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      min-width: 0;
    }

    .contacts-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .contacts-title { font-size: 18px; font-weight: 500; color: #1a1a1a; }
    .contacts-actions { display: flex; align-items: center; gap: 10px; }

    .btn-more {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border: 1px solid #dadce0; border-radius: 6px;
      background: #fff; font-size: 13px; color: #3c4043; cursor: pointer;
      font-family: 'Roboto', sans-serif;
    }
    .btn-more:hover { background: #f1f3f4; }
    .btn-more svg { width: 14px; height: 14px; stroke: #5f6368; fill: none; stroke-width: 2; stroke-linecap: round; }

    .btn-filter {
      width: 34px; height: 34px; border: 1px solid #dadce0; border-radius: 6px;
      background: #fff; cursor: pointer; display: flex; align-items: center;
      justify-content: center; position: relative;
    }
    .btn-filter:hover { background: #f1f3f4; }
    .btn-filter.active { background: #e8f0fe; border-color: #1a73e8; }
    .btn-filter svg { width: 16px; height: 16px; stroke: #5f6368; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .btn-filter.active svg { stroke: #1a73e8; }
    .filter-count-badge {
      position: absolute; top: -7px; right: -7px;
      background: #1a73e8; color: #fff;
      font-size: 10px; font-weight: 500;
      min-width: 16px; height: 16px; border-radius: 8px;
      display: none; align-items: center; justify-content: center;
      padding: 0 3px;
    }
    .filter-count-badge.show { display: flex; }

    /* Table */
    .table-wrap { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid #e0e0e0; }
    th {
      text-align: left; font-size: 12px; font-weight: 500;
      color: #5f6368; padding: 10px 16px; background: #fff;
      white-space: nowrap;
    }
    th svg { width: 12px; height: 12px; stroke: #9aa0a6; fill: none; stroke-width: 2; stroke-linecap: round; margin-left: 3px; vertical-align: middle; }
    tbody tr { border-bottom: 1px solid #f1f3f4; cursor: pointer; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover td { background: #f8f9fa; }
    td { font-size: 13px; color: #3c4043; padding: 10px 16px; vertical-align: middle; }
    .td-name { font-weight: 400; display: flex; align-items: center; gap: 6px; }
    .tag-lead {
      display: inline-flex; align-items: center; gap: 3px;
      background: #e6f4ea; color: #137333;
      font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 10px;
    }
    .tag-lead svg { width: 9px; height: 9px; stroke: #137333; fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .channels { display: flex; align-items: center; gap: 4px; }
    .ch { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .ch svg { width: 13px; height: 13px; stroke: #9aa0a6; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .score-pill {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 500;
    }
    .score-green { background: #e6f4ea; color: #137333; }
    .score-amber { background: #fef3d0; color: #b06000; }
    .score-red { background: #fce8e6; color: #c5221f; }

    /* ─── Filter panel ─── */
    .filter-panel {
      width: 0;
      background: #fff;
      border-left: 1px solid #e0e0e0;
      overflow: hidden;
      transition: width 0.22s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .filter-panel.open { width: 272px; overflow-y: auto; }
    .filter-inner { width: 272px; padding: 0; }

    .fp-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; border-bottom: 1px solid #f1f3f4;
      position: sticky; top: 0; background: #fff; z-index: 5;
    }
    .fp-title { font-size: 15px; font-weight: 500; }
    .fp-clear { font-size: 13px; color: #1a73e8; cursor: pointer; font-weight: 500; display: none; }
    .fp-clear.show { display: block; }
    .fp-clear:hover { text-decoration: underline; }

    .fp-search {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid #dadce0; border-radius: 8px;
      padding: 0 12px; height: 38px; margin: 10px 12px 8px;
    }
    .fp-search:focus-within { border-color: #1a73e8; }
    .fp-search svg { width: 14px; height: 14px; stroke: #80868b; fill: none; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
    .fp-search input { border: none; outline: none; font-family: 'Roboto', sans-serif; font-size: 13px; color: #1a1a1a; background: transparent; width: 100%; }
    .fp-search input::placeholder { color: #9aa0a6; }

    .fp-list { display: flex; flex-direction: column; gap: 5px; padding: 0 10px 16px; }

    /* filter row */
    .fr {
      border-radius: 7px; border: 1px solid #dadce0;
      background: #fff; cursor: pointer; overflow: hidden;
      transition: border-color 0.12s;
    }
    .fr:not(.chip):hover { border-color: #9aa0a6; }

    .fr-hd {
      display: flex; align-items: center; gap: 8px;
      padding: 0 11px; height: 42px;
    }
    .fr-lbl { font-size: 13px; color: #3c4043; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fr-chv svg {
      width: 15px; height: 15px; stroke: #9aa0a6; fill: none;
      stroke-width: 2; stroke-linecap: round; display: block;
      transition: transform 0.18s;
    }

    /* chip / filled */
    .fr.chip { border-color: #1a73e8; border-width: 2px; background: #e8f0fe; }
    .fr.chip .fr-hd { padding: 6px 10px; height: auto; min-height: 48px; align-items: center; }
    .fr.chip .fr-body-col { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .fr.chip .fr-float-label { font-size: 11px; color: #1a73e8; font-weight: 500; margin-bottom: 1px; }
    .fr.chip .fr-lbl { color: #1d4ed8; font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fr.chip .fr-chv svg { stroke: #1a73e8; }
    .chip-x {
      width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .chip-x:hover { background: rgba(26,115,232,0.15); }
    .chip-x svg { width: 11px; height: 11px; stroke: #1a73e8; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    /* open */
    .fr.is-open { border-color: #1a73e8; border-width: 2px; }
    .fr.is-open .fr-hd { padding: 0 10px; }
    .fr.is-open .fr-lbl { font-size: 11px; color: #1a73e8; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
    .fr.is-open .fr-chv svg { stroke: #1a73e8; transform: rotate(180deg); }

    .fr-body { display: none; border-top: 1px solid #e8eaed; }
    .fr.is-open .fr-body { display: block; }

    .fr-dd-search {
      display: flex; align-items: center; gap: 6px;
      margin: 7px 9px; border: 1px solid #dadce0;
      border-radius: 6px; padding: 0 9px; height: 32px;
    }
    .fr-dd-search svg { width: 12px; height: 12px; stroke: #9aa0a6; fill: none; stroke-width: 2; stroke-linecap: round; }
    .fr-dd-search input { border: none; outline: none; font-family: 'Roboto', sans-serif; font-size: 12px; color: #1a1a1a; background: transparent; width: 100%; }
    .fr-dd-search input::placeholder { color: #9aa0a6; }

    .cb-list { display: flex; flex-direction: column; }
    .cb-row { display: flex; align-items: center; gap: 9px; padding: 6px 13px; cursor: pointer; }
    .cb-row:hover { background: #f1f3f4; }
    .cb {
      width: 15px; height: 15px; border-radius: 3px; border: 2px solid #dadce0;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; background: #fff; transition: all 0.1s;
    }
    .cb.on { background: #1a73e8; border-color: #1a73e8; }
    .cb svg { display: none; width: 9px; height: 9px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .cb.on svg { display: block; }
    .cb-lbl { font-size: 13px; color: #3c4043; }

    .fr-foot {
      display: flex; justify-content: flex-end;
      padding: 7px 11px 9px; border-top: 1px solid #f1f3f4;
      margin-top: 2px;
    }
    .apply-btn {
      background: #1a73e8; color: #fff; font-family: 'Roboto', sans-serif;
      font-size: 12px; font-weight: 500; padding: 6px 18px;
      border: none; border-radius: 6px; cursor: pointer;
    }
    .apply-btn:hover { background: #1558b0; }

    .fp-see-all {
      font-size: 13px; color: #1a73e8; font-weight: 500;
      cursor: pointer; padding: 4px 2px; margin: 2px 10px 4px; display: inline-block;
    }
    .fp-see-all:hover { text-decoration: underline; }

    /* empty state */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px 40px; color: #9aa0a6; text-align: center; gap: 10px;
    }
    .empty-state svg { width: 40px; height: 40px; stroke: #dadce0; fill: none; stroke-width: 1.5; stroke-linecap: round; }
    .empty-state p { font-size: 14px; }
  </style>
</head>

    const ALL_CONTACTS = [
      { name: 'Asif Sartaj',        tags: [],       channels: ['phone','email'],         score: null, location: 'UMKC School of Dentistry 1', date: 'Apr 13, 2026', type: 'customer', source: 'Web',    region: 'Region 1' },
      { name: '-',                   tags: ['Lead'], channels: ['phone','email','whatsapp'],score:null, location: 'Los Angeles, CA',           date: 'Apr 13, 2026', type: 'lead',     source: 'Social', region: 'Region 2' },
      { name: 'Pramod',              tags: [],       channels: ['phone','email'],         score: null, location: '100 Feet Road',              date: 'Apr 13, 2026', type: 'customer', source: 'Web',    region: 'Region 1' },
      { name: 'Vikrant',             tags: [],       channels: ['phone','email'],         score: null, location: '100 Feet Road',              date: 'Apr 13, 2026', type: 'customer', source: 'Mobile', region: 'Region 2' },
      { name: 'Vineet',              tags: [],       channels: ['email'],                 score: null, location: '100 Feet Road',              date: 'Apr 13, 2026', type: 'customer', source: 'Web',    region: 'Region 1' },
      { name: 'Brad',                tags: [],       channels: ['phone','email'],         score: null, location: '100 Feet Road - A',          date: 'Apr 13, 2026', type: 'customer', source: 'Email',  region: 'Region 3' },
      { name: 'Birdeye Automation',  tags: ['Lead'], channels: ['phone','email','whatsapp'],score:null, location: '2 locations',               date: 'Apr 13, 2026', type: 'lead',     source: 'Social', region: 'Region 2' },
      { name: 'Tes Test',            tags: [],       channels: ['phone','whatsapp'],      score: 9,    location: 'JYSK - Vancouver',           date: 'Nov 06, 2025', type: 'customer', source: 'Web',    region: 'Region 1' },
      { name: 'Asdfdasfs Asf',       tags: [],       channels: ['phone'],                 score: 2,    location: 'JYSK - Edmonton',            date: 'Nov 05, 2025', type: 'prospect', source: 'Direct', region: 'Region 3' },
      { name: 'Itavleenkaur Kaur',   tags: ['Lead'], channels: ['phone','email'],         score: null, location: 'JYSK - Vancouver',           date: 'Nov 04, 2025', type: 'lead',     source: 'Web',    region: 'Region 2' },
      { name: 'Sharim Atilano',      tags: ['Lead'], channels: ['email'],                 score: null, location: '100 Feet Road - A',          date: 'Apr 13, 2026', type: 'lead',     source: 'Email',  region: 'Region 1' },
      { name: 'Michelle Valenzuela', tags: ['Lead'], channels: ['phone','email','whatsapp'],score:null, location: '100 Feet Road - A',         date: 'Apr 13, 2026', type: 'lead',     source: 'Social', region: 'Region 3' },
      { name: 'Syed Ali',            tags: ['Lead'], channels: ['phone','email'],         score: null, location: 'JYSK - Vancouver',           date: 'Oct 27, 2025', type: 'lead',     source: 'Web',    region: 'Region 2' },
      { name: 'Asif Sartaj',        tags: ['Lead'], channels: ['phone','email'],         score: null, location: 'JYSK - Edmonton',            date: 'Oct 26, 2025', type: 'lead',     source: 'Web',    region: 'Region 1' },
      { name: 'Rahul Jain',          tags: [],       channels: ['phone','email','whatsapp'],score: 6,   location: '3 locations',               date: 'Aug 15, 2025', type: 'customer', source: 'Mobile', region: 'Region 3' },
    ];

    const FILTERS = [
      { label: 'Region',          options: ['Region 1','Region 2','Region 3'],           filterFn: (c, sel) => sel.has(c.region) },
      { label: 'Division',        options: ['Division A','Division B','Division C'],      filterFn: (c, sel) => false },
      { label: 'City',            options: ['Los Angeles, CA','JYSK - Vancouver','JYSK - Edmonton','100 Feet Road'], filterFn: (c, sel) => [...sel].some(s => c.location.includes(s)) },
      { label: 'Zip',             options: ['94102','90001','73301'],                     filterFn: () => false },
      { label: 'Content manager', options: ['Robin Williams','Kelsy Hiltz','Savannah'],   filterFn: () => false },
      { label: 'Social manager',  options: ['Manager A','Manager B','Manager C'],         filterFn: () => false },
      { label: 'Area code',       options: ['415','213','512'],                           filterFn: () => false },
      { label: 'Region manager',  options: ['Manager 1','Manager 2','Manager 3'],         filterFn: () => false },
      { label: 'Room custom',     options: ['Option 1','Option 2'],                       filterFn: () => false },
      { label: 'New alpha beta test', options: ['Alpha','Beta'],                          filterFn: () => false },
      { label: 'Custom test',     options: ['Test A','Test B'],                           filterFn: () => false },
      { label: 'Location',        options: ['100 Feet Road','JYSK - Edmonton','JYSK - Vancouver'], filterFn: (c, sel) => [...sel].some(s => c.location.includes(s)) },
      { label: 'Last activity',   options: ['Today','Last 7 days','Last 30 days','Last 90 days'], filterFn: () => false },
      { label: 'Contact type',    options: ['Lead','Customer','Prospect','Partner'],      filterFn: (c, sel) => sel.has(c.type.charAt(0).toUpperCase() + c.type.slice(1)) },
      { label: 'Experience score',options: ['Promoters','Passives','Detractors'],         filterFn: () => false },
      { label: 'Source',          options: ['Web','Mobile','Email','Social','Direct'],    filterFn: (c, sel) => sel.has(c.source) },
      { label: 'Created date',    options: ['Today','Last 7 days','Last 30 days','Last year'], filterFn: () => false },
      { label: 'Assisted by',     options: ['Robin','Savannah','Kelsy Hiltz'],            filterFn: () => false },
    ];

    let selected = {};   // { label: Set }
    let openLabel = null;
    let panelOpen = false;
    let searchQuery = '';

    /* ── Toggle panel ── */
    function togglePanel() {
      panelOpen = !panelOpen;
      document.getElementById('filter-panel').classList.toggle('open', panelOpen);
      document.getElementById('filter-toggle-btn').classList.toggle('active', panelOpen);
    }

    /* ── Render contacts ── */
    function renderContacts() {
      const activeFilters = Object.entries(selected).filter(([, s]) => s.size > 0);
      let rows = ALL_CONTACTS;

      if (activeFilters.length > 0) {
        rows = ALL_CONTACTS.filter(c => {
          return activeFilters.every(([label, sel]) => {
            const f = FILTERS.find(f => f.label === label);
            return f ? f.filterFn(c, sel) : true;
          });
        });
      }

      const tbody = document.getElementById('contacts-tbody');
      const empty = document.getElementById('empty-state');

      document.getElementById('contact-count').textContent =
        rows.length === 1 ? '1 contact' : `${rows.length.toLocaleString()} contacts`;

      if (rows.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'flex';
      } else {
        empty.style.display = 'none';
        tbody.innerHTML = rows.map(c => {
          const namePart = c.tags.includes('Lead')
            ? `${c.name} <span class="tag-lead"><svg viewBox="0 0 9 9"><polyline points="1 4.5 3.5 7 8 2"/></svg> Lead</span>`
            : c.name;
          const channels = c.channels.map(ch => {
            const icons = {
              phone: `<svg viewBox="0 0 16 16"><path d="M14 11.5a.9.9 0 01-.27.63l-1.78 1.8a1.4 1.4 0 01-1 .42c-.07 0-.16 0-.25-.02A13.6 13.6 0 013.6 12.4 12.6 12.6 0 011.67 9.3a13.7 13.7 0 01-.37-3.83 1.39 1.39 0 01.4-.98L3.5 2.7a.9.9 0 01.63-.27c.23 0 .44.08.63.23L6.54 4.4c.2.15.3.34.3.57a.9.9 0 01-.28.6l-.73.74c-.04.04-.05.08-.05.14a.6.6 0 00.08.28 7.8 7.8 0 001.44 1.84 7.6 7.6 0 001.84 1.43.63.63 0 00.3.08.2.2 0 00.15-.06l.73-.74a.88.88 0 01.62-.27c.23 0 .42.07.57.2l1.76 1.4c.2.17.3.37.3.6z"/></svg>`,
              email: `<svg viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><polyline points="1.5 3.5 8 9 14.5 3.5"/></svg>`,
              whatsapp: `<svg viewBox="0 0 16 16"><path d="M13 3A6.5 6.5 0 002.1 11.5L1 15l3.6-1.1A6.5 6.5 0 1013 3z"/></svg>`,
            };
            return `<div class="ch">${icons[ch] || ''}</div>`;
          }).join('');
          const scorePart = c.score !== null
            ? `<span class="score-pill ${c.score >= 7 ? 'score-green' : c.score >= 4 ? 'score-amber' : 'score-red'}">${c.score}</span>`
            : '-';
          return `<tr>
            <td><div class="td-name">${namePart}</div></td>
            <td><div class="channels">${channels}</div></td>
            <td>${scorePart}</td>
            <td>${c.location}</td>
            <td>${c.date}</td>
          </tr>`;
        }).join('');
      }
    }

    /* ── Render filter list ── */
    function renderFilters() {
      const activeCount = Object.values(selected).filter(s => s.size > 0).length;
      document.getElementById('filter-badge').textContent = activeCount;
      document.getElementById('filter-badge').classList.toggle('show', activeCount > 0);
      document.getElementById('fp-clear').classList.toggle('show', activeCount > 0);

      const q = searchQuery.toLowerCase();
      const container = document.getElementById('fp-list');

      container.innerHTML = FILTERS
        .filter(f => f.label.toLowerCase().includes(q))
        .map(f => {
          const sel = selected[f.label];
          const hasVal = sel && sel.size > 0;
          const isOpen = openLabel === f.label;

          if (hasVal) {
            const count = sel.size;
            const chipText = count === 1 ? [...sel][0] : `${count} ${f.label.toLowerCase()}s`;
            return `<div class="fr chip" data-label="${f.label}">
              <div class="fr-hd">
                <div class="fr-body-col">
                  <span class="fr-float-label">${f.label}</span>
                  <span class="fr-lbl">${chipText}</span>
                </div>
                <div class="chip-x" onclick="clearChip(event,'${f.label}')">
                  <svg viewBox="0 0 11 11"><line x1="1.5" y1="1.5" x2="9.5" y2="9.5"/><line x1="9.5" y1="1.5" x2="1.5" y2="9.5"/></svg>
                </div>
              </div>
            </div>`;
          }

          const cbRows = f.options.map(opt => {
            const checked = sel && sel.has(opt);
            return `<div class="cb-row" onclick="toggleOpt(event,'${f.label}','${opt}')">
              <div class="cb ${checked ? 'on' : ''}"><svg viewBox="0 0 9 9"><polyline points="1 4.5 3.5 7 8 2"/></svg></div>
              <span class="cb-lbl">${opt}</span>
            </div>`;
          }).join('');

          return `<div class="fr ${isOpen ? 'is-open' : ''}" data-label="${f.label}" onclick="toggleOpen(event,'${f.label}')">
            <div class="fr-hd">
              <span class="fr-lbl">${f.label}</span>
              <div class="fr-chv"><svg viewBox="0 0 15 15"><polyline points="3 5.5 7.5 10 12 5.5"/></svg></div>
            </div>
            <div class="fr-body">
              <div class="fr-dd-search">
                <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg>
                <input type="text" placeholder="Search" onclick="event.stopPropagation()" />
              </div>
              <div class="cb-list">${cbRows}</div>
              <div class="fr-foot">
                <button class="apply-btn" onclick="applyFilter(event,'${f.label}')">Apply</button>
              </div>
            </div>
          </div>`;
        }).join('');
    }

    /* ── Interactions ── */
    function toggleOpen(e, label) {
      e.stopPropagation();
      // If clicked on the header of an open row, close it
      if (openLabel === label) { openLabel = null; }
      else { openLabel = label; }
      renderFilters();
    }

    function toggleOpt(e, label, opt) {
      e.stopPropagation();
      if (!selected[label]) selected[label] = new Set();
      if (selected[label].has(opt)) selected[label].delete(opt);
      else selected[label].add(opt);
      if (selected[label].size === 0) delete selected[label];
      // Only update checkbox in-place, no full re-render
      const cb = e.currentTarget.querySelector('.cb');
      if (cb) cb.classList.toggle('on', !!(selected[label] && selected[label].has(opt)));
    }

    function applyFilter(e, label) {
      e.stopPropagation();
      openLabel = null;
      renderFilters();
      renderContacts();
    }

    function clearChip(e, label) {
      e.stopPropagation();
      delete selected[label];
      if (openLabel === label) openLabel = null;
      renderFilters();
      renderContacts();
    }

    function clearAll() {
      selected = {};
      openLabel = null;
      renderFilters();
      renderContacts();
    }

    function searchFilters(val) {
      searchQuery = val;
      renderFilters();
    }

    /* Close open dropdown when clicking outside */
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.fr') && openLabel) {
        openLabel = null;
        renderFilters();
      }
    });

    /* Init */
    renderContacts();
    renderFilters();
  </script>
</body>
</html>
